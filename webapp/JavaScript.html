<script>
'use strict';

var _tuttiSoci     = [];
var _debounceTimer = null;
var _pollTimer     = null;
var _inProgressCnt = 0;
var _filtroAttivo  = 'tutte';

/* ---- Avvio ---- */

document.addEventListener('DOMContentLoaded', function () {
  google.script.run
    .withSuccessHandler(function (email) {
      document.getElementById('footer-email').textContent = email || '';
    })
    .getUserEmail();

  caricaSoci();

  document.getElementById('search').addEventListener('input', function () {
    clearTimeout(_debounceTimer);
    var q = this.value;
    _debounceTimer = setTimeout(function () { filtra(q); }, 100);
  });
});

/* ---- Caricamento dati ---- */

function caricaSoci() {
  document.getElementById('lista').innerHTML =
    '<p style="padding:32px;text-align:center;color:#aaa">Caricamento in corso...</p>';

  google.script.run
    .withSuccessHandler(function (result) {
      _tuttiSoci = result.soci;

      var aggEl = document.getElementById('ultimo-aggiornamento');
      aggEl.textContent = result.aggiornato
        ? 'Ultimo aggiornamento scraper: ' + result.aggiornato
        : '';

      document.getElementById('footer-timestamp').textContent =
        'Caricato alle ' + new Date().toLocaleTimeString('it-IT', { hour: '2-digit', minute: '2-digit' });

      renderCards(_tuttiSoci, _tuttiSoci.length);
    })
    .withFailureHandler(function (err) {
      document.getElementById('lista').innerHTML =
        '<p style="padding:32px;text-align:center;color:#ef4444">Errore nel caricamento dei dati.</p>';
      console.error(err);
    })
    .getSoci();
}

/* ---- Filtro testo ---- */

// "Scadute" include anche badge-attesa (in attesa di rinnovo)
var _gruppiFiltro = {
  'badge-scaduta': ['badge-scaduta', 'badge-attesa']
};

function filtra(query) {
  var q = query.toLowerCase().trim();
  var gruppo = _gruppiFiltro[_filtroAttivo] || [_filtroAttivo];
  var risultati = _tuttiSoci.filter(function (s) {
    var testoOk = !q || [s.nominativo, s.tessera, s.tipo, s.rilascio, s.scadenza]
      .join(' ').toLowerCase().indexOf(q) !== -1;
    var badgeOk = _filtroAttivo === 'tutte' ||
      gruppo.indexOf(calcolaBadge(s.scadenza, s.tessera).cls) !== -1;
    return testoOk && badgeOk;
  });
  renderCards(risultati, _tuttiSoci.length);
}

/* ---- Filtro badge ---- */

function filtraBadge(tipo) {
  _filtroAttivo = tipo;

  var ids  = ['f-tutte', 'f-attive', 'f-scade', 'f-scadute'];
  var vals = ['tutte', 'badge-attiva', 'badge-scade', 'badge-scaduta'];
  for (var i = 0; i < ids.length; i++) {
    var el = document.getElementById(ids[i]);
    if (el) {
      if (vals[i] === tipo) {
        el.classList.add('btn-filtro-attivo');
      } else {
        el.classList.remove('btn-filtro-attivo');
      }
    }
  }

  filtra(document.getElementById('search').value);
}

/* ---- Rendering ---- */

function renderCards(soci, totale) {
  document.getElementById('contatore').textContent = soci.length + ' di ' + totale;

  var emptyState = document.getElementById('empty-state');
  var lista      = document.getElementById('lista');

  if (soci.length === 0) {
    lista.innerHTML          = '';
    emptyState.style.display = '';
    return;
  }

  emptyState.style.display = 'none';
  lista.innerHTML = soci.map(function (s) {
    var badge  = calcolaBadge(s.scadenza, s.tessera);
    var dateRow = (s.rilascio || s.scadenza)
      ? '<div class="date-row">Rilascio: ' + esc(s.rilascio || '—') + ' &nbsp;·&nbsp; Scadenza: ' + esc(s.scadenza || '—') + '</div>'
      : '';
    return (
      '<div class="card">' +
        '<div class="card-top">' +
          '<div class="nominativo">' + esc(s.nominativo) + '</div>' +
          '<span class="badge ' + badge.cls + '">' + badge.label + '</span>' +
        '</div>' +
        '<div class="tessera">' + (s.tessera ? '# ' + esc(s.tessera) : '—') + '</div>' +
        '<div class="tipo">' + esc(s.tipo || '—') + '</div>' +
        dateRow +
      '</div>'
    );
  }).join('');
}

/* ---- Badge stato ---- */

function calcolaBadge(scadenza, tessera) {
  if (!tessera) {
    return { cls: 'badge-attesa', label: 'In attesa rinnovo' };
  }
  if (!scadenza) {
    return { cls: 'badge-attiva', label: 'Attiva' };
  }
  var parti = scadenza.split('/');
  if (parti.length !== 3) {
    return { cls: 'badge-attiva', label: 'Attiva' };
  }
  var dataScad = new Date(parseInt(parti[2], 10), parseInt(parti[1], 10) - 1, parseInt(parti[0], 10));
  var oggi = new Date();
  oggi.setHours(0, 0, 0, 0);
  var gg = Math.floor((dataScad - oggi) / 86400000);
  if (gg < 0)   return { cls: 'badge-scaduta', label: 'Scaduta' };
  if (gg <= 15) return { cls: 'badge-scade',   label: 'Scade tra ' + gg + ' gg' };
  return { cls: 'badge-attiva', label: 'Attiva' };
}

/* ---- Aggiornamento con barra di avanzamento ---- */

function aggiorna() {
  _mostraModal();
  _setProgress(0, 'Avvio aggiornamento...', false, false);

  google.script.run
    .withSuccessHandler(function (res) {
      if (!res.ok) {
        _setProgress(100, res.message, true, true);
        return;
      }
      _setProgress(10, 'Workflow avviato. In attesa di conferma...', false, false);
      _inProgressCnt = 0;
      // Attendi 8s prima del primo poll: il run impiega qualche secondo ad apparire nell'API
      _pollTimer = setTimeout(_pollWorkflow, 8000);
    })
    .withFailureHandler(function (err) {
      _setProgress(100, 'Errore: ' + (err.message || String(err)), true, true);
    })
    .triggerAggiornamento();
}

function _pollWorkflow() {
  google.script.run
    .withSuccessHandler(function (stato) {
      if (stato.status === 'queued' || stato.status === 'not_found') {
        _setProgress(15, stato.message || 'In coda...', false, false);
        _pollTimer = setTimeout(_pollWorkflow, 5000);

      } else if (stato.status === 'in_progress') {
        _inProgressCnt++;
        // Curva esponenziale che si avvicina a 85%: 20 + 65*(1-e^(-n/15))
        var pct = Math.round(20 + 65 * (1 - Math.exp(-_inProgressCnt / 15)));
        pct = Math.min(pct, 85);
        var mins = Math.floor((_inProgressCnt * 5) / 60);
        var msg  = (stato.message || 'In esecuzione...') + (mins > 0 ? ' (' + mins + ' min)' : '');
        _setProgress(pct, msg, false, false);
        _pollTimer = setTimeout(_pollWorkflow, 5000);

      } else if (stato.status === 'completed') {
        var successo = stato.conclusion === 'success';
        var msg = stato.message || '';
        if (!successo && stato.runUrl) {
          msg += '\n\nLog: ' + stato.runUrl;
        }
        _setProgress(100, msg, true, !successo);
        if (successo) {
          document.getElementById('btn-ricarica').style.display = '';
        }

      } else {
        // status === 'error' o sconosciuto
        _setProgress(100, stato.message || 'Errore sconosciuto.', true, true);
      }
    })
    .withFailureHandler(function (err) {
      _setProgress(100, 'Errore di polling: ' + (err.message || String(err)), true, true);
    })
    .getWorkflowStatus();
}

/* ---- Gestione modal ---- */

function _mostraModal() {
  clearTimeout(_pollTimer);
  var fill = document.getElementById('progress-fill');
  fill.style.width      = '0%';
  fill.style.background = '';
  document.getElementById('progress-pct').textContent   = '0%';
  document.getElementById('progress-msg').textContent   = 'Avvio...';
  document.getElementById('modal-azioni').style.display = 'none';
  document.getElementById('btn-ricarica').style.display = 'none';
  document.getElementById('modal-aggiorna').style.display = 'flex';
}

function _setProgress(pct, msg, done, errore) {
  var fill = document.getElementById('progress-fill');
  fill.style.width = pct + '%';
  if (errore) fill.style.background = '#ef4444';
  document.getElementById('progress-pct').textContent = pct + '%';
  document.getElementById('progress-msg').textContent = msg;
  if (done) {
    document.getElementById('modal-azioni').style.display = '';
  }
}

function chiudiModal() {
  clearTimeout(_pollTimer);
  document.getElementById('modal-aggiorna').style.display = 'none';
}

function ricaricaDati() {
  chiudiModal();
  caricaSoci();
}

/* ---- Utilità ---- */

function esc(s) {
  return String(s || '')
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;');
}
</script>
