<style>
*, *::before, *::after {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

body {
  font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
  background: #f0f2f5;
  color: #1a1a1a;
  min-height: 100vh;
}

/* ---- Header ---- */

.app-header {
  position: sticky;
  top: 0;
  z-index: 100;
  background: #fff;
  box-shadow: 0 2px 8px rgba(0, 0, 0, .08);
}

.header-inner {
  max-width: 640px;
  margin: 0 auto;
  padding: 12px 16px 8px;
}

.app-title {
  font-size: 12px;
  font-weight: 700;
  letter-spacing: 1px;
  text-transform: uppercase;
  color: #888;
  margin-bottom: 8px;
}

/* ---- Search ---- */

.search-wrap {
  margin-bottom: 4px;
}

#search {
  width: 100%;
  font-size: 16px;
  padding: 12px 18px;
  border: 1.5px solid #e0e0e0;
  border-radius: 24px;
  outline: none;
  background: #f8f8f8;
  color: #111;
  transition: border-color .2s, box-shadow .2s, background .2s;
  -webkit-appearance: none;
}

#search:focus {
  border-color: #3b82f6;
  box-shadow: 0 0 0 3px rgba(59, 130, 246, .15);
  background: #fff;
}

#search::placeholder { color: #aaa; }

/* ---- Ultimo aggiornamento ---- */

.ultimo-aggiornamento {
  font-size: 11px;
  color: #bbb;
  min-height: 16px;
  margin: 4px 4px 4px;
}

/* ---- Filtri badge ---- */

.filtri-wrap {
  display: flex;
  gap: 6px;
  flex-wrap: wrap;
  margin-bottom: 8px;
}

.btn-filtro {
  font-size: 12px;
  font-weight: 600;
  padding: 5px 12px;
  border: 1.5px solid #e0e0e0;
  border-radius: 20px;
  background: #fff;
  color: #666;
  cursor: pointer;
  transition: all .15s;
  line-height: 1;
  white-space: nowrap;
}

.btn-filtro:hover { background: #f0f0f0; border-color: #ccc; }

.btn-filtro-attivo {
  background: #1a1a1a;
  color: #fff;
  border-color: #1a1a1a;
}

/* ---- Toolbar ---- */

.toolbar {
  display: flex;
  align-items: center;
  justify-content: space-between;
}

.contatore {
  font-size: 13px;
  color: #999;
}

.btn-aggiorna {
  font-size: 12px;
  font-weight: 600;
  padding: 6px 14px;
  border: 1px solid #d0d0d0;
  border-radius: 20px;
  background: #fff;
  color: #555;
  cursor: pointer;
  transition: background .15s, color .15s;
  line-height: 1;
}

.btn-aggiorna:hover  { background: #f0f0f0; }
.btn-aggiorna:active { background: #e0e0e0; }
.btn-aggiorna:disabled { opacity: .5; cursor: not-allowed; }

/* ---- Container ---- */

.container {
  max-width: 640px;
  margin: 0 auto;
  padding: 16px;
}

/* ---- Card ---- */

.card {
  background: #fff;
  border-radius: 12px;
  padding: 16px;
  box-shadow: 0 1px 4px rgba(0, 0, 0, .07);
  margin-bottom: 12px;
}

.card-top {
  display: flex;
  align-items: flex-start;
  justify-content: space-between;
  gap: 8px;
  margin-bottom: 6px;
}

.nominativo {
  font-size: 18px;
  font-weight: 700;
  color: #111;
  line-height: 1.3;
  word-break: break-word;
}

/* ---- Badge stato ---- */

.badge {
  flex-shrink: 0;
  font-size: 11px;
  font-weight: 700;
  padding: 3px 10px;
  border-radius: 20px;
  color: #fff;
  white-space: nowrap;
  letter-spacing: .3px;
}

.badge-attiva  { background: #10b981; }
.badge-scade   { background: #f59e0b; }
.badge-scaduta { background: #ef4444; }
.badge-attesa  { background: #6b7280; }

/* ---- Dettagli card ---- */

.tessera {
  font-size: 14px;
  font-family: ui-monospace, 'Cascadia Code', monospace;
  color: #444;
  margin-bottom: 4px;
}

.tipo {
  font-size: 13px;
  color: #999;
  margin-bottom: 4px;
}

.date-row {
  font-size: 12px;
  color: #bbb;
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 6px;
}

.date-row span + span::before {
  content: '·';
  color: #ddd;
}

/* ---- Login overlay ---- */

.login-overlay {
  position: fixed;
  inset: 0;
  background: #f0f2f5;
  display: flex;
  align-items: center;
  justify-content: center;
  z-index: 9999;
  padding: 20px;
}

.login-box {
  background: #fff;
  border-radius: 20px;
  padding: 36px 28px;
  width: 100%;
  max-width: 340px;
  box-shadow: 0 4px 24px rgba(0, 0, 0, .12);
  text-align: center;
}

.login-title {
  font-size: 22px;
  font-weight: 800;
  color: #111;
  margin-bottom: 6px;
}

.login-sub {
  font-size: 14px;
  color: #999;
  margin-bottom: 24px;
}

.login-input {
  width: 100%;
  font-size: 16px;
  padding: 14px 18px;
  border: 1.5px solid #e0e0e0;
  border-radius: 12px;
  outline: none;
  background: #f8f8f8;
  color: #111;
  margin-bottom: 12px;
  text-align: center;
  letter-spacing: 3px;
  -webkit-appearance: none;
}

.login-input:focus {
  border-color: #3b82f6;
  box-shadow: 0 0 0 3px rgba(59, 130, 246, .15);
  background: #fff;
}

.btn-login {
  width: 100%;
  font-size: 16px;
  font-weight: 700;
  padding: 14px;
  border: none;
  border-radius: 12px;
  background: #1a1a1a;
  color: #fff;
  cursor: pointer;
  transition: background .15s;
  margin-bottom: 12px;
}

.btn-login:hover  { background: #333; }
.btn-login:active { background: #000; }

.login-err {
  font-size: 13px;
  color: #ef4444;
  min-height: 18px;
}

/* ---- Empty state ---- */

.empty-state {
  text-align: center;
  padding: 64px 0;
  color: #bbb;
  font-size: 16px;
}

/* ---- Footer ---- */

.app-footer {
  max-width: 640px;
  margin: 8px auto 0;
  padding: 8px 16px 28px;
  display: flex;
  justify-content: space-between;
  flex-wrap: wrap;
  gap: 4px;
  font-size: 11px;
  color: #ccc;
}

/* ---- Modal aggiornamento ---- */

.modal-overlay {
  position: fixed;
  inset: 0;
  background: rgba(0, 0, 0, .45);
  display: flex;
  align-items: center;
  justify-content: center;
  z-index: 1000;
  padding: 16px;
}

.modal-box {
  background: #fff;
  border-radius: 16px;
  padding: 28px 24px;
  width: 100%;
  max-width: 380px;
  box-shadow: 0 8px 32px rgba(0, 0, 0, .2);
}

.modal-label {
  font-size: 14px;
  font-weight: 700;
  color: #333;
  text-align: center;
  margin-bottom: 18px;
}

.progress-track {
  width: 100%;
  height: 10px;
  background: #f0f0f0;
  border-radius: 10px;
  overflow: hidden;
  margin-bottom: 8px;
}

.progress-fill {
  height: 100%;
  width: 0%;
  background: #10b981;
  border-radius: 10px;
  transition: width .6s ease, background .3s;
}

.progress-pct {
  text-align: right;
  font-size: 12px;
  font-weight: 700;
  color: #777;
  margin-bottom: 12px;
}

.progress-msg {
  font-size: 13px;
  color: #555;
  text-align: center;
  min-height: 44px;
  white-space: pre-line;
  line-height: 1.6;
  word-break: break-word;
}

.modal-azioni {
  display: flex;
  gap: 8px;
  margin-top: 20px;
  justify-content: center;
}

.btn-modal {
  font-size: 13px;
  font-weight: 600;
  padding: 8px 20px;
  border: 1px solid #d0d0d0;
  border-radius: 20px;
  background: #fff;
  color: #555;
  cursor: pointer;
  transition: background .15s;
}

.btn-modal:hover { background: #f5f5f5; }

.btn-modal-ok {
  background: #10b981;
  color: #fff;
  border-color: #10b981;
}

.btn-modal-ok:hover { background: #0ea572; border-color: #0ea572; }

/* ================================================================
   LAYOUT MOBILE — applicato via JS (.is-mobile su <html>)
   L'iframe Google rende la pagina a 980px e la scala visivamente
   a ~390px. zoom: 2.5 inverte questo effetto portando il layout
   a ~392px effettivi, con font e spaziature normali su telefono.
   ================================================================ */

html.is-mobile { zoom: 2.5; }

.is-mobile body { background: #e8eaed; }

.is-mobile .header-inner {
  padding: 10px 14px 8px;
}

.is-mobile .app-title {
  font-size: 10px;
  margin-bottom: 6px;
}

.is-mobile .ultimo-aggiornamento { font-size: 10px; }

.is-mobile #search {
  font-size: 16px;
  padding: 14px 18px;
  border-radius: 28px;
}

.is-mobile .filtri-wrap {
  flex-wrap: nowrap;
  overflow-x: auto;
  -webkit-overflow-scrolling: touch;
  scrollbar-width: none;
  padding-bottom: 2px;
  gap: 8px;
  margin-bottom: 6px;
}
.is-mobile .filtri-wrap::-webkit-scrollbar { display: none; }

.is-mobile .btn-filtro {
  flex-shrink: 0;
  font-size: 15px;
  padding: 11px 20px;
  border-radius: 22px;
}

.is-mobile .contatore    { font-size: 16px; color: #555; }
.is-mobile .btn-aggiorna { font-size: 15px; padding: 11px 20px; border-radius: 22px; }

.is-mobile .container { padding: 10px; }

/* Card mobile: bordo sinistro colorato per stato */
.is-mobile .card {
  border-radius: 16px;
  padding: 20px 16px 18px 20px;
  margin-bottom: 10px;
  border-left: 5px solid #e0e0e0;
}

.is-mobile .card.stato-attiva  { border-left-color: #10b981; }
.is-mobile .card.stato-scade   { border-left-color: #f59e0b; }
.is-mobile .card.stato-scaduta { border-left-color: #ef4444; }
.is-mobile .card.stato-attesa  { border-left-color: #6b7280; }

/* card-top: nome sopra, badge sotto (column) */
.is-mobile .card-top {
  flex-direction: column;
  align-items: flex-start;
  gap: 8px;
  margin-bottom: 12px;
}

.is-mobile .nominativo {
  font-size: 26px;
  line-height: 1.2;
  font-weight: 800;
}

.is-mobile .badge {
  font-size: 14px;
  padding: 6px 16px;
  border-radius: 22px;
  letter-spacing: 0;
}

.is-mobile .tessera {
  font-size: 20px;
  margin-bottom: 8px;
  color: #222;
}

.is-mobile .tipo {
  font-size: 17px;
  margin-bottom: 8px;
  color: #555;
}

.is-mobile .date-row {
  font-size: 16px;
  color: #777;
  flex-direction: column;
  gap: 5px;
  line-height: 1.5;
}

.is-mobile .date-row span + span::before {
  content: '';
  margin: 0;
}
</style>
