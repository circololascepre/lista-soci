<style>
*, *::before, *::after {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

body {
  font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
  background: #f0f2f5;
  color: #1a1a1a;
  min-height: 100vh;
}

/* ---- Header ---- */

.app-header {
  position: sticky;
  top: 0;
  z-index: 100;
  background: #fff;
  box-shadow: 0 2px 8px rgba(0, 0, 0, .08);
}

.header-inner {
  max-width: 640px;
  margin: 0 auto;
  padding: 12px 16px 8px;
}

.app-title {
  font-size: 12px;
  font-weight: 700;
  letter-spacing: 1px;
  text-transform: uppercase;
  color: #888;
  margin-bottom: 8px;
}

/* ---- Search ---- */

.search-wrap {
  margin-bottom: 4px;
}

#search {
  width: 100%;
  font-size: 16px;
  padding: 12px 18px;
  border: 1.5px solid #e0e0e0;
  border-radius: 24px;
  outline: none;
  background: #f8f8f8;
  color: #111;
  transition: border-color .2s, box-shadow .2s, background .2s;
  -webkit-appearance: none;
}

#search:focus {
  border-color: #3b82f6;
  box-shadow: 0 0 0 3px rgba(59, 130, 246, .15);
  background: #fff;
}

#search::placeholder {
  color: #aaa;
}

/* ---- Ultimo aggiornamento ---- */

.ultimo-aggiornamento {
  font-size: 11px;
  color: #bbb;
  min-height: 16px;
  margin: 4px 4px 4px;
}

/* ---- Toolbar ---- */

.toolbar {
  display: flex;
  align-items: center;
  justify-content: space-between;
}

.contatore {
  font-size: 13px;
  color: #999;
}

.btn-aggiorna {
  font-size: 12px;
  font-weight: 600;
  padding: 6px 14px;
  border: 1px solid #d0d0d0;
  border-radius: 20px;
  background: #fff;
  color: #555;
  cursor: pointer;
  transition: background .15s, color .15s;
  line-height: 1;
}

.btn-aggiorna:hover  { background: #f0f0f0; }
.btn-aggiorna:active { background: #e0e0e0; }
.btn-aggiorna:disabled { opacity: .5; cursor: not-allowed; }

/* ---- Container ---- */

.container {
  max-width: 640px;
  margin: 0 auto;
  padding: 16px;
}

/* ---- Card ---- */

.card {
  background: #fff;
  border-radius: 12px;
  padding: 16px;
  box-shadow: 0 1px 4px rgba(0, 0, 0, .07);
  margin-bottom: 12px;
}

.card-top {
  display: flex;
  align-items: flex-start;
  justify-content: space-between;
  gap: 8px;
  margin-bottom: 6px;
}

.nominativo {
  font-size: 18px;
  font-weight: 700;
  color: #111;
  line-height: 1.3;
  word-break: break-word;
}

/* ---- Badge stato ---- */

.badge {
  flex-shrink: 0;
  font-size: 11px;
  font-weight: 700;
  padding: 3px 10px;
  border-radius: 20px;
  color: #fff;
  white-space: nowrap;
  letter-spacing: .3px;
}

.badge-attiva  { background: #10b981; }
.badge-scade   { background: #f59e0b; }
.badge-scaduta { background: #ef4444; }
.badge-attesa  { background: #6b7280; }

/* ---- Dettagli card ---- */

.tessera {
  font-size: 14px;
  font-family: ui-monospace, 'Cascadia Code', monospace;
  color: #444;
  margin-bottom: 4px;
}

.tipo {
  font-size: 13px;
  color: #999;
  margin-bottom: 4px;
}

.date-row {
  font-size: 12px;
  color: #bbb;
}

/* ---- Empty state ---- */

.empty-state {
  text-align: center;
  padding: 64px 0;
  color: #bbb;
  font-size: 16px;
}

/* ---- Footer ---- */

.app-footer {
  max-width: 640px;
  margin: 8px auto 0;
  padding: 8px 16px 28px;
  display: flex;
  justify-content: space-between;
  flex-wrap: wrap;
  gap: 4px;
  font-size: 11px;
  color: #ccc;
}

/* ---- Modal aggiornamento ---- */

.modal-overlay {
  position: fixed;
  inset: 0;
  background: rgba(0, 0, 0, .45);
  display: flex;
  align-items: center;
  justify-content: center;
  z-index: 1000;
  padding: 16px;
}

.modal-box {
  background: #fff;
  border-radius: 16px;
  padding: 28px 24px;
  width: 100%;
  max-width: 380px;
  box-shadow: 0 8px 32px rgba(0, 0, 0, .2);
}

.modal-label {
  font-size: 14px;
  font-weight: 700;
  color: #333;
  text-align: center;
  margin-bottom: 18px;
}

.progress-track {
  width: 100%;
  height: 10px;
  background: #f0f0f0;
  border-radius: 10px;
  overflow: hidden;
  margin-bottom: 8px;
}

.progress-fill {
  height: 100%;
  width: 0%;
  background: #10b981;
  border-radius: 10px;
  transition: width .6s ease, background .3s;
}

.progress-pct {
  text-align: right;
  font-size: 12px;
  font-weight: 700;
  color: #777;
  margin-bottom: 12px;
}

.progress-msg {
  font-size: 13px;
  color: #555;
  text-align: center;
  min-height: 44px;
  white-space: pre-line;
  line-height: 1.6;
  word-break: break-word;
}

.modal-azioni {
  display: flex;
  gap: 8px;
  margin-top: 20px;
  justify-content: center;
}

.btn-modal {
  font-size: 13px;
  font-weight: 600;
  padding: 8px 20px;
  border: 1px solid #d0d0d0;
  border-radius: 20px;
  background: #fff;
  color: #555;
  cursor: pointer;
  transition: background .15s;
}

.btn-modal:hover { background: #f5f5f5; }

.btn-modal-ok {
  background: #10b981;
  color: #fff;
  border-color: #10b981;
}

.btn-modal-ok:hover { background: #0ea572; border-color: #0ea572; }

/* ---- Mobile ---- */

@media (max-width: 640px) {
  .header-inner { padding: 10px 12px 6px; }
  .container    { padding: 12px; }
  .nominativo   { font-size: 16px; }
}
</style>
