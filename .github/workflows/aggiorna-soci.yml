name: Aggiorna Lista Soci

on:
  workflow_dispatch:
  schedule:
    - cron: "0 6 * * *"

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Chrome
        uses: browser-actions/setup-chrome@v1
        id: setup-chrome

      - name: Esporta percorso Chrome
        run: |
          CHROME=$(which google-chrome || which chromium-browser || which chromium 2>/dev/null || echo "")
          if [ -n "$CHROME" ]; then
            echo "CHROME_BIN=$CHROME" >> $GITHUB_ENV
            echo "Chrome trovato: $CHROME"
          fi

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r scraper/requirements.txt

      - name: Versione Chrome installata
        run: google-chrome --version || chromium-browser --version || echo "Chrome non trovato in PATH"

      - name: Run scraper
        env:
          AICS_USERNAME: ${{ secrets.AICS_USERNAME }}
          AICS_PASSWORD: ${{ secrets.AICS_PASSWORD }}
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          SPREADSHEET_ID: ${{ secrets.SPREADSHEET_ID }}
        run: python scraper/soci.py

      - name: Upload screenshot diagnostico
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: screenshots
          path: /tmp/screenshot_*.png
          if-no-files-found: ignore
